# Default application properties
server.port=8080
spring.application.name=reactive-sse-app

#Local redis configuration
spring.redis.url=${REDIS_URL:redis://:mypass@localhost:6379}
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
spring.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:0}
spring.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT:-1ms}

# Logging configuration
logging.level.com.kamruddin.reactive=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator endpoints for health checks and debugging
management.endpoints.web.exposure.include=health,info,metrics,heapdump,prometheus
management.endpoint.health.show-details=always
management.endpoint.heapdump.enabled=true
management.health.redis.enabled=true

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Enable scheduling
spring.task.scheduling.pool.size=2

# Reactor Netty connection pool
reactor.netty.pool.max-connections=16000
reactor.netty.pool.max-idle-time=60s
reactor.netty.pool.max-life-time=3600s

# SSE Connection Management
spring.webflux.multipart.max-in-memory-size=1KB
server.netty.connection-timeout=60s
server.netty.idle-timeout=30s
