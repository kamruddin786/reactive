# Default application properties
server.port=8080
spring.application.name=reactive-sse-app

# Logging
logging.level.com.kamruddin.reactive=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator exposure
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,heapdump
management.endpoint.health.show-details=always
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoint.heapdump.enabled=true
management.metrics.export.prometheus.enabled=true

# Optional common tags
management.metrics.tags.application=reactive-sse-app

# Info endpoint metadata
info.app.name=reactive-sse-app
info.app.description=Reactive SSE demo
info.app.version=@project.version@

# Redis configuration
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
spring.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:0}
spring.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT:-1ms}

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Scheduling
spring.task.scheduling.pool.size=2
