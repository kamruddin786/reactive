apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: reactive-sse-local-scaler
  namespace: default
  labels:
    app: reactive-sse-local
spec:
  scaleTargetRef:
    name: reactive-sse-local
  minReplicaCount: 1
  maxReplicaCount: 10  # Increased to handle more users
  pollingInterval: 30
  cooldownPeriod: 60
  triggers:

  # OPTION 1: Direct Redis-based scaling using a LIST (Alternative approach)
  # KEDA Redis scaler works with lists, using LLEN to count connected user IDs
  # Commented out to use the more intelligent HTTP endpoint scaling
  - type: redis
    metadata:
      address: redis-local-service.default.svc.cluster.local:6379
      listName: 'connected_users_list'
      listLength: '5000'  # Updated threshold
      enableTLS: 'false'
      databaseIndex: '0'
    authenticationRef:
      name: redis-auth-trigger
  # OPTION 2: Custom HTTP endpoint scaling (UPDATED for higher thresholds)
  # This uses our custom application endpoint with intelligent scaling algorithm
  # Uncomment to use the intelligent scaling algorithm instead of simple Redis counting
  # - type: metrics-api
  #   metadata:
  #     targetValue: '5000'  # Scale up when more than 5000 connected users per pod
  #     url: http://reactive-sse-local-service.default.svc.cluster.local:8080/metrics/keda/user-connections
  #     valueLocation: 'totalConnectedUsers'
  #     method: 'query'
  #     timeout: '3000'
