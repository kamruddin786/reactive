apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactive-sse-local
  labels:
    app: reactive-sse-local
    environment: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reactive-sse-local
  template:
    metadata:
      labels:
        app: reactive-sse-local
        environment: local
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: reactive-sse
        image: reactive-sse-app:latest
        imagePullPolicy: Never  # Use local image, don't pull from registry
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: REDIS_HOST
          value: "redis-local-service"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          value: "mypass"
        - name: REDIS_URL
          value: "redis://:mypass@redis-local-service:6379"
        - name: MONGO_HOST
          value: "mongodb-local-service"
        - name: MONGO_PORT
          value: "27050"
        - name: MONGO_DATABASE
          value: "reactive_messages"
        - name: LOGGING_LEVEL_COM_KAMRUDDIN_REACTIVE
          value: "DEBUG"
        - name: JAVA_OPTS
          value: >
            -XX:+UseG1GC -XX:MaxGCPauseMillis=200 
            -Xms256m -Xmx768m -XX:+UseStringDeduplication 
            -XX:+UseContainerSupport
            -Dcom.sun.management.jmxremote
            -Dcom.sun.management.jmxremote.port=9696
            -Dcom.sun.management.jmxremote.rmi.port=9696
            -Dcom.sun.management.jmxremote.local.only=false
            -Dcom.sun.management.jmxremote.authenticate=false
            -Dcom.sun.management.jmxremote.ssl=false
            -Djava.rmi.server.hostname=127.0.0.1
        - name: SPRING_JMX_ENABLED
          value: "true"
        - name: MANAGEMENT_ENDPOINTS_JMX_EXPOSURE_INCLUDE
          value: "*"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            memory: "768Mi"
            cpu: "200m"
          limits:
            memory: "1200Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # Load-balancing health check (separate from K8s health)
        # Using the correct path under /api/notifications
        startupProbe:
          httpGet:
            path: /api/notifications/health/load-balance
            port: 8080
            httpHeaders:
            - name: X-Health-Check-Type
              value: "load-balance"
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30  # Allow more failures since this is for load balancing
---
apiVersion: v1
kind: Service
metadata:
  name: reactive-sse-local-service
  labels:
    app: reactive-sse-local
spec:
  type: NodePort
  selector:
    app: reactive-sse-local
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 30080
