apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactive-sse-local
  labels:
    app: reactive-sse-local
    environment: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reactive-sse-local
  template:
    metadata:
      labels:
        app: reactive-sse-local
        environment: local
    spec:
      containers:
      - name: reactive-sse
        image: reactive-sse-app:latest
        imagePullPolicy: Never  # Use local image, don't pull from registry
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: REDIS_HOST
          value: "redis-local-service"
        - name: REDIS_PORT
          value: "6379"
        - name: MONGO_HOST
          value: "mongodb-local-service"
        - name: MONGO_PORT
          value: "27050"
        - name: MONGO_DATABASE
          value: "reactive_messages"
        - name: LOGGING_LEVEL_COM_KAMRUDDIN_REACTIVE
          value: "DEBUG"
        - name: JAVA_OPTS
          value: >
            -XX:+UseG1GC -XX:MaxGCPauseMillis=200 
            -Xms256m -Xmx1152m -XX:+UseStringDeduplication 
            -XX:+UseContainerSupport
            -Dcom.sun.management.jmxremote
            -Dcom.sun.management.jmxremote.port=9696
            -Dcom.sun.management.jmxremote.rmi.port=9696
            -Dcom.sun.management.jmxremote.local.only=false
            -Dcom.sun.management.jmxremote.authenticate=false
            -Dcom.sun.management.jmxremote.ssl=false
            -Djava.rmi.server.hostname=127.0.0.1
        - name: SPRING_JMX_ENABLED
          value: "true"
        - name: MANAGEMENT_ENDPOINTS_JMX_EXPOSURE_INCLUDE
          value: "*"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1.5Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: reactive-sse-local-service
  labels:
    app: reactive-sse-local
spec:
  type: NodePort
  selector:
    app: reactive-sse-local
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 30080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reactive-sse-local-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reactive-sse-local
  minReplicas: 1
  maxReplicas: 4  # Reduced for local environment
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80  # Higher threshold for local
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85
