apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactive-sse-app
  labels:
    app: reactive-sse-app
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reactive-sse-app
  template:
    metadata:
      labels:
        app: reactive-sse-app
        version: v1
    spec:
      containers:
      - name: reactive-sse-app
        image: us-central1-docker.pkg.dev/rfx-eng-tm-poc-d/poc-images/reactive-sse-app:v2.1.11
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: REDIS_HOST
          value: "10.139.0.107"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_POOL_MAX_ACTIVE
          value: "8"
        - name: REDIS_POOL_MAX_IDLE
          value: "8"
        - name: REDIS_POOL_MIN_IDLE
          value: "0"
        - name: REDIS_POOL_MAX_WAIT
          value: "-1ms"
        - name: REACTOR_NETTY_POOL_MAX_CONNECTIONS
          value: "15000"
        - name: REACTOR_NETTY_POOL_MAX_IDLE_TIME
          value: "300s"
        - name: REACTOR_NETTY_POOL_MAX_LIFE_TIME
          value: "3600s"
        - name: SERVER_NETTY_CONNECTION_TIMEOUT
          value: "60s"
        - name: SERVER_NETTY_IDLE_TIMEOUT
          value: "60s"
        - name: SPRING_WEBFLUX_MULTIPART_MAX_IN_MEMORY_SIZE
          value: "1KB"
        - name: JAVA_OPTS
          value: >
            -XX:+UseG1GC -XX:MaxGCPauseMillis=200 
            -Xms256m -Xmx768m -XX:+UseStringDeduplication 
            -XX:+UseContainerSupport
            -Dcom.sun.management.jmxremote
            -Dcom.sun.management.jmxremote.port=9898
            -Dcom.sun.management.jmxremote.rmi.port=9898
            -Dcom.sun.management.jmxremote.local.only=false
            -Dcom.sun.management.jmxremote.authenticate=false
            -Dcom.sun.management.jmxremote.ssl=false
            -Djava.rmi.server.hostname=127.0.0.1
        - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
          value: "health,info,metrics,heapdump"
        - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
          value: "always"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "300Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      restartPolicy: Always
