apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: reactive-sse-redis-topics-scaler
  namespace: default
spec:
  scaleTargetRef:
    name: reactive-sse-app
  minReplicaCount: 1
  maxReplicaCount: 15
  pollingInterval: 15
  cooldownPeriod: 60
  idleReplicaCount: 1
  triggers:
  # Monitor Redis pub/sub subscriber count for user messages topic
  - type: redis
    metadata:
      address: redis-service:6379
      password: mypass
      # This monitors the number of subscribers to your USER_MESSAGES_TOPIC
      listName: "pubsub:numsub:user:messages"
      listLength: '3'
      enableTLS: 'false'
    authenticationRef:
      name: redis-auth

  # Monitor Redis memory usage (when message queues grow)
  - type: redis
    metadata:
      address: redis-service:6379
      password: mypass
      # Scale when Redis memory usage indicates message backlog
      listName: "info:memory:used_memory_rss"
      listLength: '100000000'  # 100MB
      enableTLS: 'false'
    authenticationRef:
      name: redis-auth

  # Monitor custom application metrics via Prometheus
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: redis_published_messages_rate
      threshold: '10'
      query: rate(redis_messages_published_total{topic=~"user:messages|broadcast:messages"}[2m])

---
# Alternative ScaledObject focusing on message lag
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: reactive-sse-message-lag-scaler
  namespace: default
spec:
  scaleTargetRef:
    name: reactive-sse-app
  minReplicaCount: 2
  maxReplicaCount: 20
  triggers:
  # Scale based on message processing lag using custom metrics
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: message_processing_lag_seconds
      threshold: '5'
      query: |
        (
          increase(messages_published_total{topic="user:messages"}[1m]) + 
          increase(messages_published_total{topic="broadcast:messages"}[1m])
        ) - 
        increase(messages_processed_total[1m])

  # Scale based on active SSE connections per pod
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: sse_connections_per_pod
      threshold: '100'
      query: avg(sse_active_connections{app="reactive-sse-app"}) by (pod)
